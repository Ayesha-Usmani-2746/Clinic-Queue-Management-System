<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MediCare — Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css"/>
</head>
<body>

  <div class="login-page">

    <!-- Left Panel -->
    <div class="left-panel">
      <div class="brand">
        <div class="brand-icon">🏥</div>
        <h1>MediCare Clinic</h1>
        <p>Digital Queue Management System</p>
      </div>
      <div class="features">
        <div class="feat">✅ Real-time queue management</div>
        <div class="feat">✅ WhatsApp appointment booking</div>
        <div class="feat">✅ Live counter display</div>
        <div class="feat">✅ Voice announcements</div>
      </div>
    </div>

    <!-- Right Panel — Login Form -->
    <div class="right-panel">
      <div class="login-card">

        <div class="login-header">
          <h2>Admin Login</h2>
          <p>Sign in to manage the queue</p>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail"
                 placeholder="admin@medicare.com"/>
          <span class="field-error" id="emailError"></span>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="pass-wrap">
            <input type="password" id="loginPassword"
                   placeholder="Enter your password"/>
            <button class="eye-btn" id="eyeBtn" type="button">👁</button>
          </div>
          <span class="field-error" id="passError"></span>
        </div>

        <div class="error-box" id="errorBox"></div>

        <button class="login-btn" id="loginBtn">
          Sign In
        </button>

        <div class="login-note">
          🔒 This portal is for authorized staff only
        </div>

      </div>
    </div>

  </div>

  <script src="js/login.js"></script>
</body>
</html>
